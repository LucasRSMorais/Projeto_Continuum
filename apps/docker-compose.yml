version: '3.8'

services:
  db:
    image: mysql:9.0
    container_name: continuum_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: railway
      MYSQL_USER: continuum_user
      MYSQL_PASSWORD: continuum_password
    ports:
      - "3306:3306"
    volumes:
      # Caminho relativo indicando a pasta database que está ao lado
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  backend:
    build: 
      context: ./Server
      dockerfile: Dockerfile
    container_name: continuum_backend
    restart: always
    ports:
      - "127.0.0.1:8000:80" # API de desenvolvimento acessível somente neste computador
    environment:
      # Variáveis para o seu código PHP ler
      - DB_HOST=db
      - DB_USER=continuum_user
      - DB_PASSWORD=continuum_password
      - DB_NAME=railway
      - DASHBOARD_AUTH_DISABLED=true
    depends_on:
      - db

volumes:
  mysql_data: