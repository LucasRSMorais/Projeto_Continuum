# Bloqueia acesso à pasta de configuração
<Directory /var/www/html/config>
    Require all denied
</Directory>

# Bloqueia arquivos sensíveis
<FilesMatch "(^\.|\.env$|composer\.(json|lock)$)">
    Require all denied
</FilesMatch>

# Cabeçalhos de segurança HTTP
<IfModule mod_headers.c>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    Header always unset X-Powered-By
    Header always set Cache-Control "no-store"

    Header always edit Server "^Apache.*" "Apache"
</IfModule>

# Oculta informações da versão do Apache
ServerTokens Prod
ServerSignature Off