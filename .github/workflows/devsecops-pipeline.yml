name: DevSecOps Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  # 1. Varredura de Segredos com TruffleHog
  secret-scanning:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan por Segredos Vazados
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          # O TruffleHog identifica automaticamente os commits
          # de acordo com o evento push ou pull_request.
          extra_args: --results=verified,unknown

  # 2. Análise de Dependências (SCA) com Trivy
  sca-scanning:
    name: Trivy SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan de Vulnerabilidades em Bibliotecas
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # 3. Análise Estática (SAST) com Semgrep
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Executar Análise Semgrep
        run: |
          semgrep scan \
            --config auto \
            --severity ERROR \
            --sarif \
            --verbose \
            --output=semgrep_results.sarif \
            --error

      - name: Upload do relatório SARIF para o GitHub
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        if: always() && hashFiles('semgrep_results.sarif') != ''
        with:
          sarif_file: semgrep_results.sarif
          category: "semgrep-php-js"