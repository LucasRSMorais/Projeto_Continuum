name: DevSecOps Pipeline
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
 
jobs:
  # 1. Varredura de Segredos com TruffleHog (Impede vazamento de chaves e senhas)
  secret-scanning:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para analisar todo o histórico de commits
 
      - name: Scan por Segredos Vazados
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: development
          extra_args: --only-verified
 
  # 2. Análise de Dependências (SCA) com Trivy (Checa bibliotecas de terceiros)
  sca-scanning:
    name: Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
 
      - name: Scan de Vulnerabilidades em Bibliotecas
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Falha o pipeline se encontrar vulnerabilidades
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL' # Restrito a severidades Alta e Crítica
 
  # 3. Análise Estática (SAST) com Semgrep (Suporta PHP + JS + HTML e Bloqueia o Build)
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Permite publicar os alertas na aba Security
 
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
 
      - name: Executar Análise Semgrep
        # Roda as regras de segurança oficiais (OWASP, vulnerabilidades top)
        # O parâmetro --error falha o build (exit-code 1) se achar falhas com severidade de ERRO (High/Critical)
        run: semgrep scan --config auto --sarif --output=semgrep_results.sarif --error

      - name: Upload do relatório SARIF para o GitHub
        # Mesmo se o Semgrep falhar o build anterior, este passo roda para salvar os resultados na aba Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep_results.sarif
          category: "semgrep-php-js"
