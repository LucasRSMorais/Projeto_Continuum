name: DevSecOps Avançado

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  # 1. Job de Testes Dinâmicos (DAST com OWASP ZAP)
  dast-scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    env:
      DB_ROOT_PASSWORD: ci-root-password
      DB_APP_USER: continuum_user
      DB_APP_PASSWORD: ci-app-password
      DB_USER: continuum_user
      DB_PASSWORD: ci-app-password
      DB_NAME: railway
      DB_HOST: db
      APP_ENV: development
      API_PUBLISHED_PORT: 8000

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build and Run Application
        run: |
          docker compose -f apps/Server/docker-compose.yml up -d --build
          echo "Aguardando o backend iniciar..."
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8000/; then
              echo "Backend iniciado com sucesso!"
              exit 0
            fi
            echo "Aguardando... tentativa $i"
            sleep 5
          done
          echo "O backend não iniciou corretamente."
          docker compose -f apps/Server/docker-compose.yml logs
          exit 1

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true

      - name: Stop and clean up container
        if: always()
        run: |
          docker compose -f apps/Server/docker-compose.yml down -v

  # 2. Job de Privacidade e Dados Sensíveis (Bearer)
  privacy-scan:
    name: Privacy - Bearer Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Run Bearer Security Scanner
        uses: bearer/bearer-action@v2
        with:
          severity: critical
          exit-code: 1

  # 3. Job de Cadeia de Suprimentos (Trivy SBOM)
  supply-chain:
    name: Supply Chain - Trivy SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Run Trivy SBOM Generator
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30